name: Docker Compose Up and Health Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  docker-compose-up:
    name: Docker Compose Up
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: [3.9]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Create .env from .env.test
      run: make init

    - name: Build local images
      run: make build

    - name: Run docker-compose up -d
      run: make run

    - name: Start the engine, camera API and fake cameras
      run: make run-engine

      # Wait for containers to start up (adjust the sleep time as needed)
    - name: Wait for containers to start
      run: sleep 120

    - name: Check container health
      env:
        COMPOSE_PROFILES: front,tools,engine
      run: |-
        docker compose ps -a
        test -z "$(docker compose ps --filter status=unhealthy --quiet)" || { echo "Some containers are unhealthy"; exit 1; }
        test -n "$(docker compose ps --status running --quiet engine)" || { echo "The engine is not running"; exit 1; }

    - name: load tests requirements
      run: pip install -r tests/requirements.txt

    - name: launch tests
      run: pytest tests/*

    - name: Capture logs
      if: always()
      run: COMPOSE_PROFILES=front,tools,engine docker compose logs --tail=40 > logs.txt

    - name: Show logs
      if: always()
      run: cat logs.txt

    - name: Filter logs
      run: cat logs.txt | grep -i -E "error|exception" | grep -v -i "hypercorn.error" || true
